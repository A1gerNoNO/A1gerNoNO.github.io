baseURL = 'https://a1gernono.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'wangyu'
theme = 'PaperMod'

copyright = 'Copyright &copy; 2026 wangyu'
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 90

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[permalinks]
  posts = '/posts/:year/:month/:slug/'

[params]
  env = 'production'
  description = 'wangyu 的个人主页。'
  mainSections = []
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  comments = false
  hideFooter = false
  ShowToc = true
  TocOpen = false
  DateFormat = '2006-01-02'

  [params.profileMode]
    enabled = true
    title = 'wangyu'
    subtitle = '真实姓名：wangyu · 邮箱：1225045336@njupt.edu.cn'

  [[params.profileMode.buttons]]
    name = '联系我'
    url = 'mailto:1225045336@njupt.edu.cn'
  [[params.profileMode.buttons]]
    name = '关于我'
    url = '/about/'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:1225045336@njupt.edu.cn'
    title = '邮箱'
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false

[menu]
  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 1
