baseURL = 'https://A1gerNoNO.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
title = '阿尔吉'
theme = 'PaperMod'

copyright = 'Copyright &copy; 2026 阿尔吉'
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 90

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[permalinks]
  posts = '/posts/:year/:month/:slug/'

[params]
  env = 'production'
  description = '阿尔吉的技术博客，记录后端开发、项目实践与学习笔记。'
  mainSections = ['posts']
  defaultTheme = 'auto'
  disableThemeToggle = false
  disableSpecial1stPost = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  comments = false
  hideFooter = false
  ShowToc = true
  TocOpen = false
  DateFormat = '2006-01-02'

  [params.homeInfoParams]
    Title = '阿尔吉'
    Content = '记录后端开发、项目实践与学习笔记。把遇到的问题写清楚，把学到的知识留下来。'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/A1gerNoNO'
  [[params.socialIcons]]
    name = 'rss'
    url = '/index.xml'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false

[menu]
  [[menu.main]]
    name = '文章'
    url = '/posts/'
    weight = 1
  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 2
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 3
  [[menu.main]]
    name = '搜索'
    url = '/search/'
    weight = 4
  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 5
